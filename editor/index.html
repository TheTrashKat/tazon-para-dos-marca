<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de plantillas · Tazón para Dos</title>
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url('../tools/fonts/BarlowCondensed-ExtraBold.ttf'); }
  @font-face { font-family: 'Barlow'; font-weight: 500; src: url('../tools/fonts/Barlow-Medium.ttf'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('../tools/fonts/Barlow-SemiBold.ttf'); }
  @font-face { font-family: 'Barlow'; font-weight: 700; src: url('../tools/fonts/Barlow-Bold.ttf'); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif; }
  html.embed body { background: transparent; }
  html.embed svg { display: block; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--teal); background-image: var(--dots); border-bottom: 4px solid var(--ink); }
  header img { height: 48px; }
  header h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; margin: 0; text-transform: uppercase; }
  header a { margin-left: auto; color: var(--ink); font-weight: 700; }
  .app { display: grid; grid-template-columns: 240px 340px 1fr; gap: 0; min-height: calc(100vh - 80px); }
  nav { border-right: 3px solid var(--ink); padding: 12px; background: var(--cream); overflow-y: auto; }
  nav .group { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 18px; margin: 14px 4px 6px; }
  nav button { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; width: 100%; text-align: left; font: 600 15px 'Barlow', sans-serif; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  nav button small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  nav button.active { background: var(--sun); box-shadow: 4px 4px 0 var(--ink); }
  aside { border-right: 3px solid var(--ink); padding: 16px; overflow-y: auto; }
  aside h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 0; }
  #size { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  #form label { display: block; font-weight: 700; font-size: 13px; letter-spacing: .04em; margin: 12px 0 4px; }
  #form input[type=text], #form input[type=number], #form textarea, #form select { width: 100%; font: 500 16px 'Barlow', sans-serif; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); }
  #form textarea { resize: vertical; }
  #form .check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .actions button, .actions label { font: 700 14px 'Barlow', sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 10px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; text-align: center; }
  .actions .primary { grid-column: 1 / -1; background: var(--sun); box-shadow: 5px 5px 0 var(--ink); font-size: 16px; }
  .actions input[type=file] { display: none; }
  #status { min-height: 20px; font-size: 14px; margin-top: 12px; }
  main { padding: 24px; display: grid; place-items: start center; background: #ede8df; overflow: auto; }
  #preview { width: min(100%, 640px); max-height: calc(100vh - 140px); border: 3px solid var(--ink); box-shadow: 8px 8px 0 rgba(40,32,59,.25); background: #fff; }
  #preview svg { width: 100%; height: 100%; display: block; }
  .help { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.45; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    nav { display: flex; gap: 6px; overflow-x: auto; border-right: 0; border-bottom: 3px solid var(--ink); }
    nav .group { display: none; }
    nav button { min-width: 180px; }
    aside { border-right: 0; border-bottom: 3px solid var(--ink); }
    #preview { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <img src="../assets/logo/logotipo-horizontal.svg" alt="Tazón para Dos">
  <h1>Editor de plantillas</h1>
  <a href="../">← Kit de marca</a>
</header>
<div class="app">
  <nav id="templates" aria-label="Plantillas"></nav>
  <aside>
    <h2 id="title">…</h2>
    <p id="size"></p>
    <form id="form" onsubmit="return false"></form>
    <div class="actions">
      <button type="button" id="png" class="primary">⬇ Descargar PNG</button>
      <button type="button" id="svg">SVG</button>
      <button type="button" id="reset">Restablecer</button>
      <button type="button" id="export">Guardar JSON</button>
      <label>Abrir JSON<input type="file" id="import" accept="application/json,.json"></label>
    </div>
    <p id="status" role="status"></p>
    <p class="help">Los cambios se guardan solos en este navegador. Los titulares se achican automáticamente si el texto es largo. Usa <b>Guardar JSON</b> para conservar o compartir el contenido de una publicación.</p>
  </aside>
  <main><div id="preview"></div></main>
</div>
<script src="brand-data.js"></script>
<script src="primitives.js"></script>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
