<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720">
  <!-- Banner web · Tazón para Dos · estilo Pop y Cómic -->
  <!-- Paleta: teal #55C4BF · rosa #EA6077 · amarillo #F8CB67 · morado oscuro #28203B · crema #F7F2E8 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Barlow:wght@500;600;700&amp;display=swap');
      .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; }
      .sans { font-family: 'Barlow', 'Segoe UI', sans-serif; }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#28203B" opacity="0.10"/>
    </pattern>

    <symbol id="bowl" viewBox="0 0 120 124">
      <g stroke="#28203B" stroke-width="7" stroke-linecap="round">
        <line x1="16" y1="20" x2="29" y2="38"/>
        <line x1="35" y1="12" x2="43" y2="31"/>
        <line x1="85" y1="12" x2="77" y2="31"/>
        <line x1="104" y1="20" x2="91" y2="38"/>
      </g>
      <g fill="#28203B">
        <circle cx="60" cy="54" r="20"/>
        <circle cx="42" cy="61" r="16"/>
        <circle cx="78" cy="61" r="16"/>
        <circle cx="30" cy="70" r="11"/>
        <circle cx="90" cy="70" r="11"/>
        <rect x="20" y="64" width="80" height="12"/>
        <path d="M14,80 H106 C106,101 92,112 75,112 H45 C28,112 14,101 14,80 Z"/>
        <rect x="45" y="116" width="30" height="7" rx="3.5"/>
      </g>
      <g fill="#F7F2E8">
        <rect x="44" y="85" width="6" height="13" rx="3"/>
        <rect x="70" y="85" width="6" height="13" rx="3"/>
        <path d="M53,101 H67 A7,7 0 0 1 53,101 Z"/>
      </g>
    </symbol>

    <symbol id="sparkle" viewBox="-50 -50 100 100">
      <path d="M0,-50 C6,-10 10,-6 50,0 C10,6 6,10 0,50 C-6,10 -10,6 -50,0 C-10,-6 -6,-10 0,-50 Z"/>
    </symbol>

    <symbol id="meeple" viewBox="0 0 100 100">
      <path d="M50,4 C62,4 70,13 70,24 C70,31 67,36 63,40 L94,52 C99,54 99,62 94,64 L72,70 L84,96 H58 L50,78 L42,96 H16 L28,70 L6,64 C1,62 1,54 6,52 L37,40 C33,36 30,31 30,24 C30,13 38,4 50,4 Z"/>
    </symbol>
  </defs>

  <!-- ========== FONDO ========== -->
  <rect width="1920" height="720" fill="#55C4BF"/>
  <rect width="1920" height="720" fill="url(#dots)"/>

  <!-- Panel rosa diagonal con franja crema -->
  <path d="M1000,0 H1040 L900,640 H860 Z" fill="#F7F2E8"/>
  <path d="M1040,0 H1920 V640 H900 Z" fill="#EA6077"/>
  <path d="M1040,0 H1920 V640 H900 Z" fill="url(#dots)"/>
  <path d="M1800,0 H1920 V120 Z" fill="#F8CB67"/>

  <!-- ========== TEXTO ========== -->
  <circle cx="132" cy="96" r="46" fill="#F7F2E8" stroke="#28203B" stroke-width="4"/>
  <use href="#bowl" x="103" y="65" width="58" height="60"/>
  <text x="198" y="98" class="cond" font-size="44" fill="#28203B" letter-spacing="1">TAZÓN PARA DOS</text>
  <text x="200" y="128" class="sans" font-weight="600" font-size="15" fill="#28203B" letter-spacing="5">ESPACIO CULTURAL · ENGATIVÁ</text>

  <g class="cond">
    <text x="86" y="292" font-size="128" fill="#28203B">JUGAR TAMBIÉN</text>
    <text x="93" y="427" font-size="150" fill="#28203B">ES ESCUCHAR.</text>
    <text x="86" y="420" font-size="150" fill="#F7F2E8">ES ESCUCHAR.</text>
  </g>
  <use href="#sparkle" x="846" y="190" width="58" height="58" fill="#F8CB67"/>

  <text class="sans" font-weight="600" font-size="26" fill="#28203B">
    <tspan x="88" y="480">Un lugar para jugar, imaginar y convertir nuestras voces</tspan>
    <tspan x="88" y="514">en historias que se escuchan.</tspan>
  </text>

  <!-- Botones -->
  <rect x="94" y="552" width="300" height="62" rx="31" fill="#28203B"/>
  <rect x="86" y="544" width="300" height="62" rx="31" fill="#F8CB67" stroke="#28203B" stroke-width="4"/>
  <text x="236" y="584" text-anchor="middle" class="sans" font-weight="700" font-size="21" fill="#28203B" letter-spacing="2">QUIERO PARTICIPAR →</text>

  <rect x="410" y="544" width="300" height="62" rx="31" fill="none" stroke="#28203B" stroke-width="4"/>
  <text x="560" y="584" text-anchor="middle" class="sans" font-weight="700" font-size="21" fill="#28203B" letter-spacing="2">▶  ESCUCHA EL PODCAST</text>

  <!-- ========== ILUSTRACIÓN ========== -->
  <ellipse cx="1400" cy="568" rx="330" ry="26" fill="#28203B" opacity="0.22"/>

  <!-- Carta -->
  <g transform="translate(1110,330) rotate(-14)">
    <rect x="-62" y="-88" width="124" height="176" rx="14" fill="#F7F2E8" stroke="#28203B" stroke-width="6"/>
    <path d="M0,-38 L27,0 L0,38 L-27,0 Z" fill="#EA6077" stroke="#28203B" stroke-width="4"/>
    <circle cx="-40" cy="-64" r="6" fill="#EA6077"/>
    <circle cx="40" cy="64" r="6" fill="#EA6077"/>
  </g>

  <!-- D20 -->
  <g transform="translate(1370,320) rotate(-8)" stroke="#28203B" stroke-width="7" stroke-linejoin="round">
    <path d="M0,-200 L173,-100 L173,100 L0,200 L-173,100 L-173,-100 Z" fill="#F8CB67"/>
    <path d="M0,-105 L92,58 L-92,58 Z" fill="#FBD98A"/>
    <path d="M0,-200 L0,-105 M0,-105 L173,-100 M0,-105 L-173,-100 M92,58 L173,-100 M92,58 L173,100 M92,58 L0,200 M-92,58 L-173,-100 M-92,58 L-173,100 M-92,58 L0,200" fill="none"/>
    <text x="0" y="36" text-anchor="middle" class="cond" font-size="92" fill="#28203B" stroke="none">20</text>
  </g>

  <!-- Micrófono (podcast) -->
  <g transform="translate(1700,300)" stroke="#28203B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80,10 A80,80 0 0 0 80,10" fill="none"/>
    <line x1="0" y1="90" x2="0" y2="200"/>
    <rect x="-60" y="196" width="120" height="22" rx="11" fill="#28203B"/>
    <rect x="-52" y="-150" width="104" height="200" rx="52" fill="#F7F2E8"/>
    <path d="M-52,-60 H52 M-52,-20 H52" fill="none"/>
    <circle cx="-20" cy="-110" r="5" fill="#28203B" stroke="none"/>
    <circle cx="0" cy="-118" r="5" fill="#28203B" stroke="none"/>
    <circle cx="20" cy="-110" r="5" fill="#28203B" stroke="none"/>
    <circle cx="-10" cy="-90" r="5" fill="#28203B" stroke="none"/>
    <circle cx="10" cy="-90" r="5" fill="#28203B" stroke="none"/>
    <!-- ondas de sonido -->
    <path d="M100,-110 A90,90 0 0 1 100,10" fill="none" stroke="#F8CB67" stroke-width="10"/>
    <path d="M136,-140 A130,130 0 0 1 136,40" fill="none" stroke="#F7F2E8" stroke-width="10"/>
  </g>

  <!-- Meeple -->
  <use href="#meeple" x="1500" y="445" width="105" height="105" fill="#28203B"/>

  <!-- Dado de seis -->
  <g transform="translate(1160,520) rotate(14)">
    <rect x="-42" y="-42" width="84" height="84" rx="15" fill="#F7F2E8" stroke="#28203B" stroke-width="6"/>
    <g fill="#28203B">
      <circle cx="-20" cy="-20" r="7"/><circle cx="20" cy="-20" r="7"/>
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-20" cy="20" r="7"/><circle cx="20" cy="20" r="7"/>
    </g>
  </g>

  <use href="#sparkle" x="1050" y="60" width="44" height="44" fill="#28203B"/>
  <use href="#sparkle" x="1560" y="70" width="34" height="34" fill="#F7F2E8"/>
  <use href="#sparkle" x="1840" y="470" width="40" height="40" fill="#F8CB67"/>

  <!-- ========== FRANJA INFERIOR ========== -->
  <rect x="0" y="640" width="1920" height="80" fill="#28203B"/>
  <rect x="0" y="640" width="1920" height="8" fill="#F8CB67"/>
  <g class="sans" font-weight="700" font-size="20" fill="#F7F2E8" letter-spacing="3">
    <circle cx="104" cy="684" r="10" fill="#55C4BF"/>
    <text x="124" y="691">JUEGOS DE MESA</text>
    <circle cx="354" cy="684" r="10" fill="#EA6077"/>
    <text x="374" y="691">ROL</text>
    <circle cx="474" cy="684" r="10" fill="#F8CB67"/>
    <text x="494" y="691">PODCAST NARRATIVO</text>
    <text x="1834" y="691" text-anchor="end" font-weight="500" opacity="0.85">UN ESPACIO SEGURO PARA CREAR EN COMUNIDAD · ENGATIVÁ, BOGOTÁ</text>
  </g>
</svg>
