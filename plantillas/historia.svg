<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Historia (Instagram/WhatsApp 9:16) · Tazón para Dos -->
  <!-- Paleta: teal #55C4BF · rosa #EA6077 · amarillo #F8CB67 · morado oscuro #28203B · crema #F7F2E8 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Barlow:wght@500;600;700&amp;display=swap');
      .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; }
      .sans { font-family: 'Barlow', 'Segoe UI', sans-serif; }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#28203B" opacity="0.10"/>
    </pattern>
    <symbol id="bowl" viewBox="0 0 120 124">
      <g stroke="#28203B" stroke-width="7" stroke-linecap="round">
        <line x1="16" y1="20" x2="29" y2="38"/><line x1="35" y1="12" x2="43" y2="31"/>
        <line x1="85" y1="12" x2="77" y2="31"/><line x1="104" y1="20" x2="91" y2="38"/>
      </g>
      <g fill="#28203B">
        <circle cx="60" cy="54" r="20"/><circle cx="42" cy="61" r="16"/><circle cx="78" cy="61" r="16"/>
        <circle cx="30" cy="70" r="11"/><circle cx="90" cy="70" r="11"/>
        <rect x="20" y="64" width="80" height="12"/>
        <path d="M14,80 H106 C106,101 92,112 75,112 H45 C28,112 14,101 14,80 Z"/>
        <rect x="45" y="116" width="30" height="7" rx="3.5"/>
      </g>
      <g fill="#F7F2E8">
        <rect x="44" y="85" width="6" height="13" rx="3"/><rect x="70" y="85" width="6" height="13" rx="3"/>
        <path d="M53,101 H67 A7,7 0 0 1 53,101 Z"/>
      </g>
    </symbol>
    <symbol id="sparkle" viewBox="-50 -50 100 100">
      <path d="M0,-50 C6,-10 10,-6 50,0 C10,6 6,10 0,50 C-6,10 -10,6 -50,0 C-10,-6 -6,-10 0,-50 Z"/>
    </symbol>
    <symbol id="meeple" viewBox="0 0 100 100">
      <path d="M50,4 C62,4 70,13 70,24 C70,31 67,36 63,40 L94,52 C99,54 99,62 94,64 L72,70 L84,96 H58 L50,78 L42,96 H16 L28,70 L6,64 C1,62 1,54 6,52 L37,40 C33,36 30,31 30,24 C30,13 38,4 50,4 Z"/>
    </symbol>
  </defs>

  <!-- Fondo -->
  <rect width="1080" height="1920" fill="#55C4BF"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  <path d="M820,0 H1080 V260 Z" fill="#F8CB67"/>
  <path d="M950,0 H1080 V130 Z" fill="#EA6077"/>

  <path d="M0,920 L1080,850 L1080,892 L0,962 Z" fill="#F7F2E8"/>
  <path d="M0,962 L1080,892 L1080,1330 L0,1390 Z" fill="#EA6077"/>
  <path d="M0,962 L1080,892 L1080,1330 L0,1390 Z" fill="url(#dots)"/>
  <path d="M0,1390 L1080,1330 L1080,1920 L0,1920 Z" fill="#28203B"/>
  <path d="M0,1390 L1080,1330 L1080,1342 L0,1402 Z" fill="#F8CB67"/>

  <!-- Cabecera (bajo la zona de la interfaz de Instagram) -->
  <circle cx="132" cy="300" r="56" fill="#F7F2E8" stroke="#28203B" stroke-width="5"/>
  <use href="#bowl" x="97" y="263" width="70" height="72"/>
  <text x="212" y="302" class="cond" font-size="54" fill="#28203B" letter-spacing="1">TAZÓN PARA DOS</text>
  <text x="214" y="340" class="sans" font-weight="600" font-size="18" fill="#28203B" letter-spacing="6">ESPACIO CULTURAL · ENGATIVÁ</text>

  <!-- Titular -->
  <g class="cond">
    <text x="72" y="560" font-size="150" fill="#28203B">JUGAR TAMBIÉN</text>
    <text x="81" y="729" font-size="178" fill="#28203B">ES ESCUCHAR.</text>
    <text x="72" y="720" font-size="178" fill="#F7F2E8">ES ESCUCHAR.</text>
  </g>
  <use href="#sparkle" x="950" y="350" width="74" height="74" fill="#F8CB67"/>
  <use href="#sparkle" x="960" y="770" width="40" height="40" fill="#F7F2E8"/>

  <text class="sans" font-weight="600" font-size="34" fill="#28203B">
    <tspan x="76" y="800">Un lugar para jugar, imaginar y convertir</tspan>
    <tspan x="76" y="842">nuestras voces en historias que se escuchan.</tspan>
  </text>

  <!-- Ilustración -->
  <ellipse cx="540" cy="1300" rx="320" ry="24" fill="#28203B" opacity="0.22"/>

  <g transform="translate(200,1120) rotate(-14)">
    <rect x="-62" y="-88" width="124" height="176" rx="14" fill="#F7F2E8" stroke="#28203B" stroke-width="6"/>
    <path d="M0,-38 L27,0 L0,38 L-27,0 Z" fill="#EA6077" stroke="#28203B" stroke-width="4"/>
    <circle cx="-40" cy="-64" r="6" fill="#EA6077"/><circle cx="40" cy="64" r="6" fill="#EA6077"/>
  </g>

  <g transform="translate(530,1120) rotate(-8)" stroke="#28203B" stroke-width="7" stroke-linejoin="round">
    <path d="M0,-180 L156,-90 L156,90 L0,180 L-156,90 L-156,-90 Z" fill="#F8CB67"/>
    <path d="M0,-95 L83,52 L-83,52 Z" fill="#FBD98A"/>
    <path d="M0,-180 L0,-95 M0,-95 L156,-90 M0,-95 L-156,-90 M83,52 L156,-90 M83,52 L156,90 M83,52 L0,180 M-83,52 L-156,-90 M-83,52 L-156,90 M-83,52 L0,180" fill="none"/>
    <text x="0" y="33" text-anchor="middle" class="cond" font-size="84" fill="#28203B" stroke="none">20</text>
  </g>

  <g transform="translate(870,1100) scale(0.8)" stroke="#28203B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80,10 A80,80 0 0 0 80,10" fill="none"/>
    <line x1="0" y1="90" x2="0" y2="200"/>
    <rect x="-60" y="196" width="120" height="22" rx="11" fill="#28203B"/>
    <rect x="-52" y="-150" width="104" height="200" rx="52" fill="#F7F2E8"/>
    <path d="M-52,-60 H52 M-52,-20 H52" fill="none"/>
    <g fill="#28203B" stroke="none">
      <circle cx="-20" cy="-110" r="6"/><circle cx="0" cy="-118" r="6"/><circle cx="20" cy="-110" r="6"/>
      <circle cx="-10" cy="-90" r="6"/><circle cx="10" cy="-90" r="6"/>
    </g>
    <path d="M100,-110 A90,90 0 0 1 100,10" fill="none" stroke="#F8CB67" stroke-width="12"/>
    <path d="M136,-140 A130,130 0 0 1 136,40" fill="none" stroke="#F7F2E8" stroke-width="12"/>
  </g>

  <use href="#meeple" x="250" y="1210" width="90" height="90" fill="#28203B"/>
  <g transform="translate(730,1270) rotate(14)">
    <rect x="-38" y="-38" width="76" height="76" rx="13" fill="#F7F2E8" stroke="#28203B" stroke-width="5"/>
    <g fill="#28203B"><circle cx="-18" cy="-18" r="6.5"/><circle cx="18" cy="-18" r="6.5"/><circle cx="0" cy="0" r="6.5"/><circle cx="-18" cy="18" r="6.5"/><circle cx="18" cy="18" r="6.5"/></g>
  </g>
  <use href="#sparkle" x="70" y="960" width="44" height="44" fill="#28203B"/>
  <use href="#sparkle" x="700" y="930" width="32" height="32" fill="#F7F2E8"/>

  <!-- Cierre -->
  <text x="540" y="1500" text-anchor="middle" class="cond" font-size="112" fill="#F7F2E8">VEN A JUGAR.</text>
  <text x="540" y="1580" text-anchor="middle" class="cond" font-size="72" fill="#F8CB67">QUÉDATE A COMPARTIR.</text>
  <text x="540" y="1640" text-anchor="middle" class="sans" font-weight="700" font-size="26" fill="#F7F2E8" letter-spacing="4">JUEGOS DE MESA · ROL · PODCAST</text>

  <rect x="340" y="1672" width="400" height="64" rx="32" fill="#F8CB67"/>
  <text x="540" y="1714" text-anchor="middle" class="sans" font-weight="700" font-size="28" fill="#28203B" letter-spacing="1">@tazonparados</text>
</svg>
