<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Post cuadrado (Instagram/Facebook) · Tazón para Dos -->
  <!-- Paleta: teal #55C4BF · rosa #EA6077 · amarillo #F8CB67 · morado oscuro #28203B · crema #F7F2E8 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Barlow:wght@500;600;700&amp;display=swap');
      .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; }
      .sans { font-family: 'Barlow', 'Segoe UI', sans-serif; }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#28203B" opacity="0.10"/>
    </pattern>
    <symbol id="bowl" viewBox="0 0 120 124">
      <g stroke="#28203B" stroke-width="7" stroke-linecap="round">
        <line x1="16" y1="20" x2="29" y2="38"/><line x1="35" y1="12" x2="43" y2="31"/>
        <line x1="85" y1="12" x2="77" y2="31"/><line x1="104" y1="20" x2="91" y2="38"/>
      </g>
      <g fill="#28203B">
        <circle cx="60" cy="54" r="20"/><circle cx="42" cy="61" r="16"/><circle cx="78" cy="61" r="16"/>
        <circle cx="30" cy="70" r="11"/><circle cx="90" cy="70" r="11"/>
        <rect x="20" y="64" width="80" height="12"/>
        <path d="M14,80 H106 C106,101 92,112 75,112 H45 C28,112 14,101 14,80 Z"/>
        <rect x="45" y="116" width="30" height="7" rx="3.5"/>
      </g>
      <g fill="#F7F2E8">
        <rect x="44" y="85" width="6" height="13" rx="3"/><rect x="70" y="85" width="6" height="13" rx="3"/>
        <path d="M53,101 H67 A7,7 0 0 1 53,101 Z"/>
      </g>
    </symbol>
    <symbol id="sparkle" viewBox="-50 -50 100 100">
      <path d="M0,-50 C6,-10 10,-6 50,0 C10,6 6,10 0,50 C-6,10 -10,6 -50,0 C-10,-6 -6,-10 0,-50 Z"/>
    </symbol>
    <symbol id="meeple" viewBox="0 0 100 100">
      <path d="M50,4 C62,4 70,13 70,24 C70,31 67,36 63,40 L94,52 C99,54 99,62 94,64 L72,70 L84,96 H58 L50,78 L42,96 H16 L28,70 L6,64 C1,62 1,54 6,52 L37,40 C33,36 30,31 30,24 C30,13 38,4 50,4 Z"/>
    </symbol>
  </defs>

  <!-- Fondo -->
  <rect width="1080" height="1080" fill="#55C4BF"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <path d="M900,0 H1080 V180 Z" fill="#F8CB67"/>
  <path d="M990,0 H1080 V90 Z" fill="#EA6077"/>

  <path d="M0,560 L1080,480 L1080,518 L0,598 Z" fill="#F7F2E8"/>
  <path d="M0,598 L1080,518 L1080,900 L0,950 Z" fill="#EA6077"/>
  <path d="M0,598 L1080,518 L1080,900 L0,950 Z" fill="url(#dots)"/>
  <path d="M0,950 L1080,900 L1080,1080 L0,1080 Z" fill="#28203B"/>
  <path d="M0,950 L1080,900 L1080,910 L0,960 Z" fill="#F8CB67"/>

  <!-- Cabecera -->
  <circle cx="110" cy="104" r="46" fill="#F7F2E8" stroke="#28203B" stroke-width="4"/>
  <use href="#bowl" x="81" y="73" width="58" height="60"/>
  <text x="176" y="106" class="cond" font-size="44" fill="#28203B" letter-spacing="1">TAZÓN PARA DOS</text>
  <text x="178" y="136" class="sans" font-weight="600" font-size="15" fill="#28203B" letter-spacing="5">ESPACIO CULTURAL · ENGATIVÁ</text>

  <!-- Titular -->
  <g class="cond">
    <text x="64" y="300" font-size="122" fill="#28203B">JUGAR TAMBIÉN</text>
    <text x="71" y="437" font-size="146" fill="#28203B">ES ESCUCHAR.</text>
    <text x="64" y="430" font-size="146" fill="#F7F2E8">ES ESCUCHAR.</text>
  </g>
  <use href="#sparkle" x="830" y="190" width="70" height="70" fill="#F8CB67"/>
  <use href="#sparkle" x="930" y="300" width="34" height="34" fill="#F7F2E8"/>

  <!-- Ilustración -->
  <ellipse cx="540" cy="870" rx="260" ry="20" fill="#28203B" opacity="0.22"/>

  <g transform="translate(240,720) rotate(-14)">
    <rect x="-55" y="-78" width="110" height="156" rx="13" fill="#F7F2E8" stroke="#28203B" stroke-width="6"/>
    <path d="M0,-34 L24,0 L0,34 L-24,0 Z" fill="#EA6077" stroke="#28203B" stroke-width="4"/>
    <circle cx="-35" cy="-56" r="6" fill="#EA6077"/><circle cx="35" cy="56" r="6" fill="#EA6077"/>
  </g>

  <g transform="translate(540,705) rotate(-8)" stroke="#28203B" stroke-width="7" stroke-linejoin="round">
    <path d="M0,-160 L139,-80 L139,80 L0,160 L-139,80 L-139,-80 Z" fill="#F8CB67"/>
    <path d="M0,-84 L74,46 L-74,46 Z" fill="#FBD98A"/>
    <path d="M0,-160 L0,-84 M0,-84 L139,-80 M0,-84 L-139,-80 M74,46 L139,-80 M74,46 L139,80 M74,46 L0,160 M-74,46 L-139,-80 M-74,46 L-139,80 M-74,46 L0,160" fill="none"/>
    <text x="0" y="30" text-anchor="middle" class="cond" font-size="76" fill="#28203B" stroke="none">20</text>
  </g>

  <g transform="translate(840,700) scale(0.72)" stroke="#28203B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80,10 A80,80 0 0 0 80,10" fill="none"/>
    <line x1="0" y1="90" x2="0" y2="200"/>
    <rect x="-60" y="196" width="120" height="22" rx="11" fill="#28203B"/>
    <rect x="-52" y="-150" width="104" height="200" rx="52" fill="#F7F2E8"/>
    <path d="M-52,-60 H52 M-52,-20 H52" fill="none"/>
    <g fill="#28203B" stroke="none">
      <circle cx="-20" cy="-110" r="6"/><circle cx="0" cy="-118" r="6"/><circle cx="20" cy="-110" r="6"/>
      <circle cx="-10" cy="-90" r="6"/><circle cx="10" cy="-90" r="6"/>
    </g>
    <path d="M100,-110 A90,90 0 0 1 100,10" fill="none" stroke="#F8CB67" stroke-width="12"/>
    <path d="M136,-140 A130,130 0 0 1 136,40" fill="none" stroke="#F7F2E8" stroke-width="12"/>
  </g>

  <use href="#meeple" x="360" y="790" width="80" height="80" fill="#28203B"/>
  <g transform="translate(700,830) rotate(14)">
    <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#F7F2E8" stroke="#28203B" stroke-width="5"/>
    <g fill="#28203B"><circle cx="-16" cy="-16" r="6"/><circle cx="16" cy="-16" r="6"/><circle cx="0" cy="0" r="6"/><circle cx="-16" cy="16" r="6"/><circle cx="16" cy="16" r="6"/></g>
  </g>
  <use href="#sparkle" x="100" y="600" width="40" height="40" fill="#28203B"/>
  <use href="#sparkle" x="700" y="560" width="30" height="30" fill="#F7F2E8"/>

  <!-- Cierre -->
  <g class="sans" font-weight="700" text-anchor="middle" letter-spacing="3">
    <text x="540" y="1010" font-size="26" fill="#F7F2E8">JUEGOS DE MESA · ROL · PODCAST</text>
    <text x="540" y="1052" font-size="26" fill="#F8CB67" letter-spacing="1">@tazonparados</text>
  </g>
</svg>
